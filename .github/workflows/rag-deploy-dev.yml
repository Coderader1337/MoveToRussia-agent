name: RAG bot — deploy dev

on:
  push:
    branches:
      - rag_develop
    paths:
      - "rag/**"
      - ".github/workflows/rag-deploy-dev.yml"
  workflow_dispatch:

concurrency:
  group: rag-deploy-dev
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup SSH key
        run: |
          install -m 700 -d ~/.ssh
          echo "${{ secrets.RAG_VPS_SSH_KEY }}" | tr -d '\r' > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.RAG_VPS_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null || true
          ssh-keygen -y -f ~/.ssh/deploy_key > /dev/null

      - name: Sync rag/ to VPS (dev)
        run: |
          rsync -avz --delete \
            -e "ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no" \
            --exclude 'venv/' \
            --exclude '.env' \
            --exclude 'data/' \
            --exclude '__pycache__/' \
            --exclude 'deploy/github_actions_deploy_key*' \
            rag/ "${{ secrets.RAG_VPS_USER }}@${{ secrets.RAG_VPS_HOST }}:/opt/movetorussia/rag-dev/"

      - name: Install deps and restart dev bot
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no \
            "${{ secrets.RAG_VPS_USER }}@${{ secrets.RAG_VPS_HOST }}" \
            "find /opt/movetorussia/rag-dev/deploy -name '*.sh' -exec chmod +x {} + && \
             bash /opt/movetorussia/rag-dev/deploy/install-and-restart.sh \
               /opt/movetorussia/rag-dev movetorussia-rag-bot-dev"
