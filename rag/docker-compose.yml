
services:
  qdrant:
    image: qdrant/qdrant:v1.13.2
    container_name: movetorussia_qdrant
    ports:
      - "${QDRANT_PORT:-6333}:6333"
      - "${QDRANT_GRPC_PORT:-6334}:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/6333 && echo -e \"GET /healthz HTTP/1.1\\r\\nHost: localhost\\r\\n\\r\\n\" >&3 && head -1 <&3 | grep -q 200'"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - rag-network

  embedder:
    build: ./embedder
    container_name: movetorussia_embedder
    env_file:
      - .env
    ports:
      - "${EMBEDDER_PORT:-8081}:8081"
    environment:
      - VOYAGE_API_KEY=${VOYAGE_API_KEY:-}
      - VOYAGE_BASE_URL=${VOYAGE_BASE_URL:-https://api.voyageai.com}
      - VOYAGE_MODEL=${VOYAGE_MODEL:-voyage-4-large}
      - VOYAGE_OUTPUT_DIMENSION=${VOYAGE_OUTPUT_DIMENSION:-2048}
      - VOYAGE_OUTPUT_DTYPE=${VOYAGE_OUTPUT_DTYPE:-float}
      - VOYAGE_TIMEOUT=${VOYAGE_TIMEOUT:-120}
      - VOYAGE_RETRIES=${VOYAGE_RETRIES:-3}
      - LOG_LEVEL=INFO
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8081/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - rag-network

volumes:
  qdrant_data:

networks:
  rag-network:
    driver: bridge
